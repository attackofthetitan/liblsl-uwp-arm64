name: Build UWP ARM64 liblsl

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: uwp-arm64-release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build\uwp-arm64 `
            -G "Visual Studio 17 2022" `
            -A ARM64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            "-DCMAKE_SYSTEM_VERSION=10.0" `
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\install" `
            -DLSL_BUILD_STATIC=OFF `
            -DLSL_BUILD_EXAMPLES=OFF `
            -DLSL_UNITTESTS=OFF `
            -DLSL_TOOLS=OFF `
            -DLSL_BUNDLED_BOOST=ON `
            -DLSL_BUNDLED_PUGIXML=ON `
            -DLSL_SLIMARCHIVE=ON `
            -DLSL_WINVER=0x0A00

      - name: Build
        shell: pwsh
        run: cmake --build build\uwp-arm64 --config Release --parallel

      - name: Install
        shell: pwsh
        run: cmake --install build\uwp-arm64 --config Release

      - name: Upload UWP ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: liblsl-uwp-arm64-release
          path: install
